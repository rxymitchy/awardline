{% extends "base.html" %}
{% block title %}Analysing quote · Awardline{% endblock %}

{% block content %}
<div class="page-narrow centered">
  <div class="progress-card">
    <div class="progress-spinner">
      <div class="spinner"></div>
    </div>
    
    <h2 id="status-heading">🤖 Agent is working...</h2>
    <p class="progress-task" id="current-step">Initializing...</p>

    <div id="tool-log" class="tool-log"></div>

    <div id="error-message" class="alert alert-error" style="display: none;"></div>
  </div>
</div>

<script>
const runId = "{{ run_id }}";
const statusUrl = `/api/run/${runId}/status`;
let pollInterval;

async function checkStatus() {
  try {
    const response = await fetch(statusUrl);
    const data = await response.json();
    
    // Update current step based on latest tool call
    const currentStepEl = document.getElementById('current-step');
    if (data.tool_calls && data.tool_calls.length > 0) {
      const lastCall = data.tool_calls[data.tool_calls.length - 1];
      let stepText = 'Processing...';
      let stepIcon = '⚙️';
      
      if (lastCall.name.includes('search') || lastCall.name.includes('retrieve')) {
        stepIcon = '🔍';
        stepText = 'Searching awards database';
      } else if (lastCall.name.includes('flag') || lastCall.name.includes('outlier')) {
        stepIcon = '⚖️';
        stepText = 'Comparing prices';
      } else if (lastCall.name.includes('draft') || lastCall.name.includes('write')) {
        stepIcon = '✍️';
        stepText = 'Writing committee note';
      }
      
      if (!lastCall.ok && data.status === 'running') {
        stepText = 'Retrying...';
      }
      
      currentStepEl.innerHTML = `${stepIcon} ${stepText}`;
    }
    
    // Update tool log with icons
    const logEl = document.getElementById('tool-log');
    logEl.innerHTML = data.tool_calls.map((tc, index) => {
      const statusIcon = tc.ok ? '✓' : '✗';
      const cls = tc.ok ? 'tool-ok' : 'tool-fail';
      const isLast = index === data.tool_calls.length - 1;
      const animClass = (data.status === 'running' && isLast) ? 'tool-active' : '';
      
      // Map tool names to icons and friendly labels
      let processIcon = '⚙️';
      let label = tc.name;
      
      if (tc.name.includes('search') || tc.name.includes('retrieve')) {
        processIcon = '🔍';
        label = 'Searching awards database';
      } else if (tc.name.includes('compare') || tc.name.includes('analyze')) {
        processIcon = '⚖️';
        label = 'Comparing prices';
      } else if (tc.name.includes('draft') || tc.name.includes('write')) {
        processIcon = '✍️';
        label = 'Writing committee note';
      } else if (tc.name.includes('filter') || tc.name.includes('rank')) {
        processIcon = '🎯';
        label = 'Filtering results';
      } else if (tc.name.includes('extract') || tc.name.includes('parse')) {
        processIcon = '📄';
        label = 'Extracting data';
      } else if (tc.name.includes('file') || tc.name.includes('save')) {
        processIcon = '💾';
        label = 'Saving note';
      }
      
      return `<div class="tool-call ${cls} ${animClass}">
        <span class="process-icon">${processIcon}</span>
        <span class="tool-label">${label}</span>
        <span class="status-icon">${statusIcon}</span>
      </div>`;
    }).join('');

    if (data.status === 'complete') {
      clearInterval(pollInterval);
      document.getElementById('status-heading').textContent = 'Analysis complete!';
      setTimeout(() => {
        window.location.href = `/note/${data.note_id}`;
      }, 800);
    } else if (data.status === 'failed') {
      clearInterval(pollInterval);
      document.getElementById('status-heading').textContent = 'Analysis failed';
      const errEl = document.getElementById('error-message');
      errEl.textContent = data.error || 'The agent could not complete the task.';
      errEl.style.display = 'block';
      document.querySelector('.spinner').style.display = 'none';
    }
  } catch (err) {
    console.error('Poll error:', err);
  }
}

// Poll every 1.5 seconds
checkStatus();
pollInterval = setInterval(checkStatus, 1500);
</script>

<style>
.progress-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 48px 40px;
  max-width: 560px;
  margin: 60px auto;
  box-shadow: var(--shadow);
  text-align: center;
}
.progress-spinner {
  margin-bottom: 24px;
}
.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
#status-heading {
  font-size: 22px;
  margin-bottom: 12px;
}
.progress-task {
  color: var(--muted);
  font-size: 15px;
  line-height: 1.5;
  margin-bottom: 28px;
  padding: 0 20px;
}
.tool-log {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  margin-top: 24px;
}
.tool-call {
  background: var(--bg);
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 14px;
  min-width: 320px;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.3s ease;
}
.tool-call .process-icon {
  font-size: 20px;
  flex-shrink: 0;
}
.tool-call .tool-label {
  flex: 1;
  font-weight: 500;
}
.tool-call .status-icon {
  flex-shrink: 0;
  font-weight: bold;
  font-size: 16px;
}
.tool-ok { 
  color: var(--success); 
  border-left: 3px solid var(--success);
  background: color-mix(in srgb, var(--success) 8%, var(--bg));
}
.tool-fail { 
  color: var(--danger); 
  border-left: 3px solid var(--danger);
  background: color-mix(in srgb, var(--danger) 8%, var(--bg));
}
.tool-active {
  animation: pulse 1.5s ease-in-out infinite;
}
</style>
{% endblock %}
