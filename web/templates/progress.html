{% extends "base.html" %}
{% block title %}Analysing quote · Awardline{% endblock %}

{% block content %}
<div class="page-narrow centered">
  <div class="progress-card">
    <div class="progress-spinner">
      <div class="spinner"></div>
    </div>
    
    <h2 id="status-heading">Agent is working...</h2>
    <p class="progress-task">{{ task }}</p>

    <div id="tool-log" class="tool-log"></div>

    <div id="error-message" class="alert alert-error" style="display: none;"></div>
  </div>
</div>

<script>
const runId = "{{ run_id }}";
const statusUrl = `/api/run/${runId}/status`;
let pollInterval;

async function checkStatus() {
  try {
    const response = await fetch(statusUrl);
    const data = await response.json();
    
    // Update tool log
    const logEl = document.getElementById('tool-log');
    logEl.innerHTML = data.tool_calls.map(tc => {
      const icon = tc.ok ? '✓' : '✗';
      const cls = tc.ok ? 'tool-ok' : 'tool-fail';
      return `<div class="tool-call ${cls}">${icon} ${tc.name}</div>`;
    }).join('');

    if (data.status === 'complete') {
      clearInterval(pollInterval);
      document.getElementById('status-heading').textContent = 'Analysis complete!';
      setTimeout(() => {
        window.location.href = `/note/${data.note_id}`;
      }, 800);
    } else if (data.status === 'failed') {
      clearInterval(pollInterval);
      document.getElementById('status-heading').textContent = 'Analysis failed';
      const errEl = document.getElementById('error-message');
      errEl.textContent = data.error || 'The agent could not complete the task.';
      errEl.style.display = 'block';
      document.querySelector('.spinner').style.display = 'none';
    }
  } catch (err) {
    console.error('Poll error:', err);
  }
}

// Poll every 1.5 seconds
checkStatus();
pollInterval = setInterval(checkStatus, 1500);
</script>

<style>
.progress-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 48px 40px;
  max-width: 560px;
  margin: 60px auto;
  box-shadow: var(--shadow);
  text-align: center;
}
.progress-spinner {
  margin-bottom: 24px;
}
.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
#status-heading {
  font-size: 22px;
  margin-bottom: 12px;
}
.progress-task {
  color: var(--muted);
  font-size: 15px;
  line-height: 1.5;
  margin-bottom: 28px;
  padding: 0 20px;
}
.tool-log {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  margin-top: 24px;
}
.tool-call {
  background: var(--bg);
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 14px;
  font-family: ui-monospace, monospace;
  min-width: 280px;
  text-align: left;
}
.tool-ok { color: var(--success); border-left: 3px solid var(--success); }
.tool-fail { color: var(--danger); border-left: 3px solid var(--danger); }
</style>
{% endblock %}
