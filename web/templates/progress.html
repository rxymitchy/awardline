{% extends "base.html" %}
{% block title %}Analysing quote · Awardline{% endblock %}

{% block content %}
<div class="page-narrow centered">
  <div class="progress-card">
    <div class="progress-spinner">
      <div class="spinner"></div>
    </div>
    
    <h2 id="status-heading">🤖 Agent is working…</h2>
    <p class="progress-task" id="current-step">Agent is reading your request…</p>

    <div id="tool-log" class="tool-log"></div>

    <div id="error-message" class="alert alert-error" style="display: none;"></div>
  </div>
</div>

<script>
const runId = "{{ run_id }}";
const statusUrl = `/api/run/${runId}/status`;
let pollInterval;

// Map raw tool names to human-readable labels and icons.
const TOOL_META = {
  search_awards:        { icon: '🔍', label: 'Searching PPIP awards database' },
  flag_price_outlier:   { icon: '⚖️', label: 'Comparing your quoted price with past contracts' },
  draft_committee_note: { icon: '✍️', label: 'Drafting value-for-money committee note' },
  file_committee_note:  { icon: '💾', label: 'Filing note to committee folder' },
};

function toolMeta(name) {
  if (TOOL_META[name]) return TOOL_META[name];
  if (name.includes('search') || name.includes('retrieve')) return { icon: '🔍', label: 'Searching awards database' };
  if (name.includes('flag') || name.includes('outlier'))    return { icon: '⚖️', label: 'Comparing prices with found records' };
  if (name.includes('draft') || name.includes('write'))     return { icon: '✍️', label: 'Drafting committee note' };
  if (name.includes('file') || name.includes('save'))       return { icon: '💾', label: 'Filing note' };
  return { icon: '⚙️', label: name };
}

// Running step counter to give each call a sequence number (e.g. 2nd search).
const toolCounts = {};

async function checkStatus() {
  try {
    const response = await fetch(statusUrl);
    const data = await response.json();
    
    // Update the subtitle to describe exactly what the agent just did or is doing.
    const currentStepEl = document.getElementById('current-step');
    if (data.status === 'running') {
      if (!data.tool_calls || data.tool_calls.length === 0) {
        currentStepEl.textContent = 'Agent is reading your request…';
      } else {
        const lastCall = data.tool_calls[data.tool_calls.length - 1];
        const meta = toolMeta(lastCall.name);
        if (!lastCall.ok) {
          currentStepEl.textContent = `${meta.icon} Retrying — adjusting parameters…`;
        } else {
          // Describe the next expected step based on what just finished.
          if (lastCall.name === 'search_awards') {
            currentStepEl.textContent = '⚖️ Agent is comparing your quoted price with found records…';
          } else if (lastCall.name === 'flag_price_outlier') {
            currentStepEl.textContent = '✍️ Agent is writing the committee note…';
          } else if (lastCall.name === 'draft_committee_note') {
            currentStepEl.textContent = '✅ Note drafted — finishing up…';
          } else {
            currentStepEl.textContent = `${meta.icon} ${meta.label}…`;
          }
        }
      }
    }

    // Build the tool log — one row per completed call.
    const logEl = document.getElementById('tool-log');
    // Track call counts per tool to label repeated searches (e.g. "Search #2").
    const counts = {};
    logEl.innerHTML = data.tool_calls.map((tc, index) => {
      const meta = toolMeta(tc.name);
      counts[tc.name] = (counts[tc.name] || 0) + 1;
      const n = counts[tc.name];

      // Build a specific, informative label for each step.
      let detailLabel;
      if (tc.name === 'search_awards') {
        detailLabel = n === 1
          ? `${meta.icon} Searching PPIP awards database for comparable contracts`
          : `${meta.icon} Searching again with broader terms (attempt ${n})`;
      } else if (tc.name === 'flag_price_outlier') {
        detailLabel = `${meta.icon} Comparing your quoted price with ${tc.comparable_count !== undefined ? tc.comparable_count + ' found contracts' : 'past contracts'}`;
      } else if (tc.name === 'draft_committee_note') {
        detailLabel = `${meta.icon} Writing the value-for-money committee note`;
      } else if (tc.name === 'file_committee_note') {
        detailLabel = `${meta.icon} Filing note to the committee drop folder`;
      } else {
        detailLabel = `${meta.icon} ${meta.label}`;
      }

      const statusIcon = tc.ok ? '✓' : '✗';
      const cls = tc.ok ? 'tool-ok' : 'tool-fail';
      const isLast = index === data.tool_calls.length - 1;
      const animClass = (data.status === 'running' && isLast && tc.ok) ? 'tool-active' : '';

      return `<div class="tool-call ${cls} ${animClass}">
        <span class="tool-label">${detailLabel}</span>
        <span class="status-icon">${statusIcon}</span>
      </div>`;
    }).join('');

    if (data.status === 'complete') {
      clearInterval(pollInterval);
      document.getElementById('status-heading').textContent = 'Analysis complete!';
      setTimeout(() => {
        window.location.href = `/note/${data.note_id}`;
      }, 800);
    } else if (data.status === 'failed') {
      clearInterval(pollInterval);
      document.getElementById('status-heading').textContent = 'Analysis failed';
      const errEl = document.getElementById('error-message');
      errEl.textContent = data.error || 'The agent could not complete the task.';
      errEl.style.display = 'block';
      document.querySelector('.spinner').style.display = 'none';
    }
  } catch (err) {
    console.error('Poll error:', err);
  }
}

// Poll every 1.5 seconds
checkStatus();
pollInterval = setInterval(checkStatus, 1500);
</script>

<style>
.progress-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 48px 40px;
  max-width: 560px;
  margin: 60px auto;
  box-shadow: var(--shadow);
  text-align: center;
}
.progress-spinner {
  margin-bottom: 24px;
}
.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
#status-heading {
  font-size: 22px;
  margin-bottom: 12px;
}
.progress-task {
  color: var(--muted);
  font-size: 15px;
  line-height: 1.5;
  margin-bottom: 28px;
  padding: 0 20px;
}
.tool-log {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  margin-top: 24px;
}
.tool-call {
  background: var(--bg);
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 14px;
  min-width: 320px;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.3s ease;
}
.tool-call .process-icon {
  font-size: 20px;
  flex-shrink: 0;
}
.tool-call .tool-label {
  flex: 1;
  font-weight: 500;
}
.tool-call .status-icon {
  flex-shrink: 0;
  font-weight: bold;
  font-size: 16px;
}
.tool-ok { 
  color: var(--success); 
  border-left: 3px solid var(--success);
  background: color-mix(in srgb, var(--success) 8%, var(--bg));
}
.tool-fail { 
  color: var(--danger); 
  border-left: 3px solid var(--danger);
  background: color-mix(in srgb, var(--danger) 8%, var(--bg));
}
.tool-active {
  animation: pulse 1.5s ease-in-out infinite;
}
</style>
{% endblock %}
