{% extends "base.html" %}
{% block title %}Check a Quote · Awardline{% endblock %}

{% block content %}
<div class="page-narrow">
  <h2>Check a quote</h2>
  <p class="page-intro">
    Enter quote details below. Agent will search PPIP awards and draft a committee note.
  </p>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/check" class="form-card">

    <div class="form-row">
      <label for="buyer">Procuring entity</label>
      <input
        id="buyer"
        name="buyer"
        type="text"
        placeholder="e.g. Nairobi City County"
        value="{{ buyer or '' }}"
        required
        autofocus
      >
    </div>

    <div class="form-row">
      <label for="item">Purchase description</label>
      <input
        id="item"
        name="item"
        type="text"
        placeholder="e.g. Supply and delivery of office furniture"
        value="{{ item or '' }}"
        required
      >
    </div>

    <div class="form-row">
      <label for="amount">Quoted amount (KES)</label>
      <input
        id="amount"
        name="amount"
        type="text"
        inputmode="decimal"
        placeholder="e.g. 1,250,000"
        value="{{ amount or '' }}"
        required
      >
    </div>

    <div class="form-row">
      <label for="supplier">Supplier <span class="optional">(optional)</span></label>
      <input
        id="supplier"
        name="supplier"
        type="text"
        placeholder="e.g. Kioli Investments Limited"
        value="{{ supplier or '' }}"
      >
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Check quote</button>
    </div>
  </form>
</div>
{% endblock %}
